<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics Trainer</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        textarea { width: 100%; height: 120px; font-size: 16px; margin-bottom: 10px; }
        .stats { font-weight: bold; margin-bottom: 15px; color: #0066cc; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Lyrics Trainer</h1>
    <div class="stats" id="stats">Lines Typed: 0</div>
    <textarea id="input" placeholder="Type lyrics here..."></textarea>
    <h3>Reference Lyrics</h3>
    <pre id="reference">Loading...</pre>

    <script>
        fetch("lyrics.txt")
            .then(res => res.text())
            .then(text => { document.getElementById("reference").textContent = text; });

        document.getElementById("input").addEventListener("input", (e) => {
            const lines = e.target.value.split("\n").filter(l => l.trim().length > 0).length;
            document.getElementById("stats").textContent = `Lines Typed: ${lines}`;
        });
    </script>
</body>
</html>
